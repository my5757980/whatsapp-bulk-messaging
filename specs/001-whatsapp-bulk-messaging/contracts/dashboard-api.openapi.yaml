openapi: 3.1.0
info:
  title: WhatsApp Bulk Messaging - Dashboard API
  version: 0.1.0
  description: >
    Internal API used by the Next.js dashboard (feature 001-whatsapp-bulk-messaging).
    Authenticated with an httpOnly session cookie; every mutating request must also send the
    X-CSRF-Token header (double-submit). Each operation lists its required permission in
    x-permission (see packages/shared/permissions.ts and the role table in spec.md).
    Phone fields are masked to the last 4 digits for the AGENT role.
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: users
  - name: settings
  - name: numbers
  - name: contacts
  - name: imports
  - name: templates
  - name: campaigns
  - name: reports
  - name: admin
  - name: system

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
      responses:
        '200':
          description: Signed in; sets sid and csrf cookies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out (revokes the session)
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      tags: [auth]
      summary: Current user with role and permissions
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      permissions: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/invitations/{token}:
    get:
      tags: [auth]
      summary: Check an invitation link
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Invitation is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, format: email }
                  role: { $ref: '#/components/schemas/Role' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/invitations/{token}/accept:
    post:
      tags: [auth]
      summary: Accept an invitation and set name and password
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                password: { type: string, minLength: 12 }
      responses:
        '200':
          description: Account active and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users:
    get:
      tags: [users]
      summary: List team members
      x-permission: users.manage
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
  /users/invitations:
    post:
      tags: [users]
      summary: Invite a team member
      x-permission: users.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Invitation created; link returned (also emailed when SMTP is configured)
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  emailed: { type: boolean }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    patch:
      tags: [users]
      summary: Change role or activation status
      x-permission: users.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
                status: { type: string, enum: [ACTIVE, DEACTIVATED] }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { description: Would remove the last active admin, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /settings:
    get:
      tags: [settings]
      summary: Company settings
      x-permission: settings.view
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    patch:
      tags: [settings]
      summary: Update default country code, timezone and consent keywords
      x-permission: settings.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /numbers:
    get:
      tags: [numbers]
      summary: List connected WhatsApp numbers
      x-permission: numbers.view
      responses:
        '200':
          description: Numbers
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WhatsAppNumber' } }
    post:
      tags: [numbers]
      summary: Connect a number (credentials validated with Meta before saving)
      x-permission: numbers.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, wabaId, phoneNumberId, accessToken]
              properties:
                label: { type: string, maxLength: 60 }
                wabaId: { type: string }
                phoneNumberId: { type: string }
                accessToken: { type: string, writeOnly: true }
      responses:
        '201':
          description: Connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppNumber' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Meta rejected the credentials (reason included), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /numbers/{id}:
    get:
      tags: [numbers]
      summary: Number details
      x-permission: numbers.view
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Number
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppNumber' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [numbers]
      summary: Update label, send rate, kill switch, manual tier or access token
      x-permission: numbers.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 60 }
                sendRatePerSecond: { type: integer, minimum: 1, maximum: 80 }
                sendingEnabled: { type: boolean }
                messagingLimitTier: { type: string }
                accessToken: { type: string, writeOnly: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppNumber' }
    delete:
      tags: [numbers]
      summary: Disconnect a number (running campaigns are paused)
      x-permission: numbers.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Disconnected }
  /numbers/{id}/refresh:
    post:
      tags: [numbers]
      summary: Re-read status, quality rating and throughput from Meta
      x-permission: numbers.view
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppNumber' }

  /contacts:
    get:
      tags: [contacts]
      summary: Search and filter contacts
      x-permission: contacts.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: q, in: query, schema: { type: string }, description: Name or phone search }
        - { name: tag, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: consent, in: query, schema: { $ref: '#/components/schemas/ConsentStatus' } }
      responses:
        '200':
          description: Page of contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Contact' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [contacts]
      summary: Create a contact
      x-permission: contacts.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /contacts/{id}:
    get:
      tags: [contacts]
      summary: Contact with consent history
      x-permission: contacts.view
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Contact'
                  - type: object
                    properties:
                      consentHistory:
                        type: array
                        items:
                          type: object
                          properties:
                            status: { $ref: '#/components/schemas/ConsentStatus' }
                            source: { type: string }
                            note: { type: [string, 'null'] }
                            createdAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [contacts]
      summary: Update a contact
      x-permission: contacts.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
    delete:
      tags: [contacts]
      summary: Delete a contact's personal data (aggregates kept)
      x-permission: contacts.delete
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
  /contacts/bulk:
    post:
      tags: [contacts]
      summary: Add/remove tags or set an attribute on many contacts
      x-permission: contacts.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactIds, action]
              properties:
                contactIds: { type: array, items: { type: string, format: uuid }, maxItems: 10000 }
                action: { type: string, enum: [ADD_TAG, REMOVE_TAG, SET_ATTRIBUTE] }
                tag: { type: string }
                attributeKey: { type: string }
                attributeValue: {}
      responses:
        '200':
          description: Number of contacts updated
          content:
            application/json:
              schema: { type: object, properties: { updated: { type: integer } } }
  /contacts/audience-preview:
    post:
      tags: [contacts]
      summary: Count contacts matching an audience filter (with exclusions)
      x-permission: campaigns.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filter: { $ref: '#/components/schemas/AudienceFilter' }
                templateCategory: { $ref: '#/components/schemas/TemplateCategory' }
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceCounts' }
  /tags:
    get:
      tags: [contacts]
      summary: List tags with contact counts
      x-permission: contacts.view
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Tag' } }
    post:
      tags: [contacts]
      summary: Create a tag
      x-permission: contacts.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 50 } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tags/{id}:
    delete:
      tags: [contacts]
      summary: Delete a tag
      x-permission: contacts.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
  /attributes:
    get:
      tags: [contacts]
      summary: List custom attribute definitions
      x-permission: contacts.view
      responses:
        '200':
          description: Attributes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AttributeDefinition' } }
    post:
      tags: [contacts]
      summary: Define a custom attribute
      x-permission: attributes.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttributeDefinition' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttributeDefinition' }
        '409': { $ref: '#/components/responses/Conflict' }
  /attributes/{id}:
    patch:
      tags: [contacts]
      summary: Rename an attribute label
      x-permission: attributes.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { label: { type: string } } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttributeDefinition' }
    delete:
      tags: [contacts]
      summary: Delete an attribute (values removed from contacts)
      x-permission: attributes.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }

  /imports:
    post:
      tags: [imports]
      summary: Upload a contacts CSV and start an import job
      x-permission: contacts.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, mapping]
              properties:
                file: { type: string, format: binary, description: CSV up to 50 MB }
                mapping: { type: string, description: JSON-encoded ImportMapping }
                optInSourceNote: { type: string, description: Required when the file's contacts are confirmed as opted in }
      responses:
        '202':
          description: Import queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /imports/{id}:
    get:
      tags: [imports]
      summary: Import job progress and counts
      x-permission: contacts.manage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
  /imports/{id}/errors:
    get:
      tags: [imports]
      summary: Download the row-level error report
      x-permission: contacts.manage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /media:
    post:
      tags: [templates]
      summary: Upload media for a template header sample or a campaign header
      x-permission: templates.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary }
                purpose: { type: string, enum: [TEMPLATE_SAMPLE, CAMPAIGN_HEADER] }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '422': { description: Unsupported type or too large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /templates:
    get:
      tags: [templates]
      summary: List templates
      x-permission: templates.view
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TemplateStatus' } }
        - { name: wabaId, in: query, schema: { type: string } }
        - { name: numberId, in: query, description: 'templates usable from this number (its WABA); added by feature 002', schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Template' } }
    post:
      tags: [templates]
      summary: Create a template and submit it to Meta (validated first)
      x-permission: templates.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '201':
          description: Submitted (status PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '422': { description: Validation errors per field, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /templates/sync:
    post:
      tags: [templates]
      summary: Sync templates from Meta for all connected accounts
      x-permission: templates.view
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  updated: { type: integer }
  /templates/{id}:
    get:
      tags: [templates]
      summary: Template details
      x-permission: templates.view
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [templates]
      summary: Delete a template locally and in Meta
      x-permission: templates.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '409': { description: Template used by a scheduled or running campaign, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /templates/{id}/duplicate:
    post:
      tags: [templates]
      summary: Copy a template into an editable draft (e.g. after rejection)
      x-permission: templates.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201':
          description: Draft copy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateInput' }

  /campaigns:
    get:
      tags: [campaigns]
      summary: List campaigns with totals
      x-permission: campaigns.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: state, in: query, schema: { $ref: '#/components/schemas/CampaignState' } }
      responses:
        '200':
          description: Page of campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [campaigns]
      summary: Create a draft campaign
      x-permission: campaigns.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /campaigns/{id}:
    get:
      tags: [campaigns]
      summary: Campaign with live totals
      x-permission: campaigns.view
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [campaigns]
      summary: Edit a draft campaign
      x-permission: campaigns.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '409': { description: Campaign is not a draft, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [campaigns]
      summary: Delete a draft campaign
      x-permission: campaigns.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '409': { description: Campaign is not a draft, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /campaigns/{id}/audience-upload:
    post:
      tags: [campaigns]
      summary: Upload a recipient list (CSV) for an UPLOAD-type draft campaign
      x-permission: campaigns.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, phoneColumn, optInConfirmed, optInSourceNote]
              properties:
                file: { type: string, format: binary }
                phoneColumn: { type: string }
                nameColumn: { type: string }
                optInConfirmed: { type: boolean, description: Must be true }
                optInSourceNote: { type: string }
      responses:
        '202':
          description: Upload processing; columns become available for variable mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
  /campaigns/{id}/estimate:
    post:
      tags: [campaigns]
      summary: Eligible/excluded counts and estimated USD cost before launch
      x-permission: campaigns.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AudienceCounts'
                  - type: object
                    properties:
                      estimatedCostUsd: { type: number }
                      messagingLimitWarning: { type: [string, 'null'] }
                      previews: { type: array, items: { type: object, properties: { phoneMasked: { type: string }, text: { type: string } } } }
  /campaigns/{id}/launch:
    post:
      tags: [campaigns]
      summary: Send now or schedule (snapshot of recipients is taken at start)
      x-permission: campaigns.launch
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduledAt: { type: [string, 'null'], format: date-time, description: Null or absent means send now }
                timezone: { type: string }
      responses:
        '200':
          description: Campaign RUNNING or SCHEDULED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '409': { description: 'Not launchable (template not approved, number unavailable, not a draft)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Scheduled time in the past or missing mapping, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /campaigns/{id}/unschedule:
    post:
      tags: [campaigns]
      summary: Move a scheduled campaign back to draft
      x-permission: campaigns.launch
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Draft again, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
  /campaigns/{id}/pause:
    post:
      tags: [campaigns]
      summary: Pause sending (effective within 10 seconds)
      x-permission: campaigns.launch
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Paused, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '409': { description: Not running, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /campaigns/{id}/resume:
    post:
      tags: [campaigns]
      summary: Resume sending to recipients not yet sent
      x-permission: campaigns.launch
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Running, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '409': { description: Not paused or blocking reason still present, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /campaigns/{id}/cancel:
    post:
      tags: [campaigns]
      summary: Cancel; unsent recipients become CANCELLED
      x-permission: campaigns.launch
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
  /campaigns/{id}/messages:
    get:
      tags: [campaigns]
      summary: Recipient-level statuses (paged)
      x-permission: campaigns.view
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MessageStatus' } }
      responses:
        '200':
          description: Page of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
  /campaigns/{id}/report:
    get:
      tags: [reports]
      summary: Totals, rates, failure reasons and estimated USD cost
      x-permission: campaigns.view
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignReport' }
  /campaigns/{id}/export:
    get:
      tags: [reports]
      summary: Export one row per recipient (audited)
      x-permission: data.export
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /campaigns/{id}/retarget:
    post:
      tags: [campaigns]
      summary: Create a draft campaign from recipients with a given status
      x-permission: campaigns.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [FAILED, NOT_READ, READ, DELIVERED, CLICKED, NOT_CLICKED, REPLIED, NOT_REPLIED, HELD_BACK], description: "Feature 005 adds CLICKED, NOT_CLICKED, REPLIED, NOT_REPLIED and HELD_BACK" }
      responses:
        '201':
          description: New draft (opted-out contacts excluded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }

  /rate-card:
    get:
      tags: [admin]
      summary: USD rate card
      x-permission: campaigns.view
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RateCardEntry' } }
    put:
      tags: [admin]
      summary: Replace rate card entries
      x-permission: ratecard.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/RateCardEntry' } }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RateCardEntry' } }
  /api-keys:
    get:
      tags: [admin]
      summary: List API keys (never the secret)
      x-permission: apikeys.manage
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ApiKey' } }
    post:
      tags: [admin]
      summary: Create an API key (secret shown once)
      x-permission: apikeys.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
                rateLimitPerMinute: { type: integer, minimum: 1, maximum: 6000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      secret: { type: string, description: 'Full key, returned only in this response' }
  /api-keys/{id}:
    delete:
      tags: [admin]
      summary: Revoke an API key
      x-permission: apikeys.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Revoked }
  /api-messages:
    get:
      tags: [reports]
      summary: Log of messages sent through the public API
      x-permission: campaigns.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: apiKeyId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Page of API messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
  /audit-logs:
    get:
      tags: [admin]
      summary: Audit log (admins only)
      x-permission: audit.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: action, in: query, schema: { type: string } }
        - { name: actorUserId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Page of entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
                  page: { $ref: '#/components/schemas/PageMeta' }
  /notifications:
    get:
      tags: [admin]
      summary: In-app notifications for the current user
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Notification' } }
  /notifications/{id}/read:
    post:
      tags: [admin]
      summary: Mark a notification as read
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Marked read }
  /health:
    get:
      tags: [system]
      summary: Liveness and dependency checks (database, Redis); requires the ops token
      security: [{ opsToken: [] }]
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string }
                  redis: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: A dependency is down }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    opsToken:
      type: apiKey
      in: header
      name: X-Ops-Token
      description: Operations token (env OPS_TOKEN) for health checks and metrics
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    Unauthorized:
      description: Not signed in or session expired
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Role lacks the required permission
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflicts with existing data or current state
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Request failed validation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION_FAILED, NOT_FOUND, CONFLICT, FORBIDDEN, META_ERROR] }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
        requestId: { type: string }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Role:
      type: string
      enum: [ADMIN, MANAGER, AGENT]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [INVITED, ACTIVE, DEACTIVATED] }
        lastLoginAt: { type: [string, 'null'], format: date-time }
    Settings:
      type: object
      properties:
        defaultCountryCode: { type: string, pattern: '^[A-Z]{2}$' }
        defaultTimezone: { type: string }
        optOutKeywords: { type: array, items: { type: string }, minItems: 1 }
        optInKeywords: { type: array, items: { type: string } }
    WhatsAppNumber:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        wabaId: { type: string }
        phoneNumberId: { type: string }
        displayPhoneNumber: { type: string }
        verifiedName: { type: string }
        connectionStatus: { type: string, enum: [CONNECTED, ERROR, DISCONNECTED] }
        qualityRating: { type: string, enum: [GREEN, YELLOW, RED, UNKNOWN] }
        messagingLimitTier: { type: [string, 'null'] }
        throughputLevel: { type: [string, 'null'] }
        sendRatePerSecond: { type: integer }
        sendingEnabled: { type: boolean }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
    ConsentStatus:
      type: string
      enum: [OPTED_IN, OPTED_OUT, UNKNOWN]
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, description: E.164; masked for AGENT role }
        countryCode: { type: string }
        name: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        attributes: { type: object, additionalProperties: true }
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        consentSource: { type: [string, 'null'] }
        consentAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ContactInput:
      type: object
      properties:
        phone: { type: string, description: International format; default country code applied if missing }
        name: { type: string, maxLength: 120 }
        tags: { type: array, items: { type: string } }
        attributes: { type: object, additionalProperties: true }
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        consentSourceNote: { type: string }
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contactCount: { type: integer }
    AttributeDefinition:
      type: object
      required: [key, label, type]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,39}$' }
        label: { type: string }
        type: { type: string, enum: [TEXT, NUMBER, DATE, BOOLEAN] }
    AudienceFilter:
      type: object
      properties:
        all:
          type: array
          items:
            oneOf:
              - type: object
                required: [tag]
                properties: { tag: { type: string } }
              - type: object
                required: [attr, op]
                properties:
                  attr: { type: string }
                  op: { type: string, enum: [eq, neq, contains, gt, lt, before, after, is_true, is_false] }
                  value: {}
    AudienceCounts:
      type: object
      properties:
        eligible: { type: integer }
        excluded:
          type: object
          properties:
            optedOut: { type: integer }
            noOptIn: { type: integer }
            invalidNumber: { type: integer }
            duplicate: { type: integer }
            missingVariable: { type: integer }
    ImportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [CONTACTS, CAMPAIGN_AUDIENCE] }
        status: { type: string, enum: [QUEUED, PROCESSING, COMPLETED, FAILED] }
        totalRows: { type: integer }
        createdCount: { type: integer }
        updatedCount: { type: integer }
        skippedCount: { type: integer }
        errorCount: { type: integer }
        columns: { type: array, items: { type: string }, description: Detected CSV columns }
        hasErrorReport: { type: boolean }
        finishedAt: { type: [string, 'null'], format: date-time }
    MediaAsset:
      type: object
      properties:
        id: { type: string, format: uuid }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        purpose: { type: string, enum: [TEMPLATE_SAMPLE, CAMPAIGN_HEADER] }
    TemplateCategory:
      type: string
      enum: [MARKETING, UTILITY, AUTHENTICATION]
    TemplateStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED, PAUSED, DISABLED, DELETED]
    TemplateButton:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [QUICK_REPLY, URL, PHONE_NUMBER] }
        text: { type: string, maxLength: 25 }
        url: { type: string, description: May end with one variable for dynamic suffix }
        urlExample: { type: string }
        phoneNumber: { type: string }
    TemplateInput:
      type: object
      required: [wabaId, name, language, category, body]
      properties:
        wabaId: { type: string }
        name: { type: string, pattern: '^[a-z0-9_]{1,512}$' }
        language: { type: string, examples: [en_US] }
        category: { $ref: '#/components/schemas/TemplateCategory' }
        header:
          type: [object, 'null']
          properties:
            format: { type: string, enum: [TEXT, IMAGE, VIDEO, DOCUMENT] }
            text: { type: string, maxLength: 60 }
            textExample: { type: string }
            mediaAssetId: { type: string, format: uuid }
        body:
          type: object
          required: [text]
          properties:
            text: { type: string, maxLength: 1024 }
            examples: { type: array, items: { type: string } }
        footer: { type: [string, 'null'], maxLength: 60 }
        buttons: { type: array, items: { $ref: '#/components/schemas/TemplateButton' }, maxItems: 10 }
    Template:
      type: object
      properties:
        id: { type: string, format: uuid }
        wabaId: { type: string }
        metaTemplateId: { type: [string, 'null'] }
        name: { type: string }
        language: { type: string }
        category: { $ref: '#/components/schemas/TemplateCategory' }
        status: { $ref: '#/components/schemas/TemplateStatus' }
        rejectionReason: { type: [string, 'null'] }
        components: { type: array, items: { type: object, additionalProperties: true } }
        variables:
          type: array
          items:
            type: object
            properties:
              key: { type: string, examples: [BODY.1, HEADER.1, BUTTON.0.1] }
              example: { type: string }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
    CampaignState:
      type: string
      enum: [DRAFT, SCHEDULED, RUNNING, PAUSED, COMPLETED, CANCELLED]
    VariableMapping:
      type: object
      additionalProperties:
        type: object
        required: [source]
        properties:
          source: { type: string, enum: [column, field, attribute, static] }
          key: { type: string, description: 'CSV column, contact field (name, phone) or attribute key' }
          value: { type: string, description: For static source }
          fallback: { type: [string, 'null'] }
    CampaignInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        numberId: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        audienceType: { type: string, enum: [FILTER, ALL_OPTED_IN, UPLOAD, RETARGET], description: 'RETARGET is set only by POST /campaigns/{id}/retarget' }
        audienceFilter: { $ref: '#/components/schemas/AudienceFilter' }
        variableMapping: { $ref: '#/components/schemas/VariableMapping' }
        headerMediaAssetId: { type: [string, 'null'], format: uuid }
    Campaign:
      allOf:
        - $ref: '#/components/schemas/CampaignInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            state: { $ref: '#/components/schemas/CampaignState' }
            scheduledAt: { type: [string, 'null'], format: date-time }
            timezone: { type: string }
            pausedReason: { type: [string, 'null'] }
            sourceCampaignId: { type: [string, 'null'], format: uuid }
            retargetStatus: { type: [string, 'null'], enum: [FAILED, NOT_READ, READ, DELIVERED, CLICKED, NOT_CLICKED, REPLIED, NOT_REPLIED, HELD_BACK, null] }
            launchedAt: { type: [string, 'null'], format: date-time }
            completedAt: { type: [string, 'null'], format: date-time }
            totals: { $ref: '#/components/schemas/StatusTotals' }
            estimatedCostUsd: { type: number }
    StatusTotals:
      type: object
      properties:
        pending: { type: integer }
        queued: { type: integer }
        sent: { type: integer }
        delivered: { type: integer }
        read: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        cancelled: { type: integer }
    MessageStatus:
      type: string
      enum: [PENDING, QUEUED, SENDING, SENT, DELIVERED, READ, FAILED, SKIPPED, CANCELLED]
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        origin: { type: string, enum: [CAMPAIGN, API] }
        phone: { type: [string, 'null'], description: Masked for AGENT; null after contact deletion }
        contactName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/MessageStatus' }
        skipReason: { type: [string, 'null'] }
        failureCode: { type: [integer, 'null'] }
        failureReason: { type: [string, 'null'] }
        attempts: { type: integer }
        sentAt: { type: [string, 'null'], format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
        failedAt: { type: [string, 'null'], format: date-time }
        costUsd: { type: [number, 'null'] }
    CampaignReport:
      type: object
      properties:
        campaignId: { type: string, format: uuid }
        totals: { $ref: '#/components/schemas/StatusTotals' }
        deliveryRate: { type: number, description: delivered+read over sent+delivered+read+failed }
        readRate: { type: number, description: read over delivered+read }
        failureReasons:
          type: array
          items:
            type: object
            properties:
              code: { type: [integer, 'null'] }
              reason: { type: string }
              count: { type: integer }
        estimatedCostUsd: { type: number }
        costIsEstimate: { type: boolean, const: true }
    RateCardEntry:
      type: object
      required: [category, countryCode, priceUsd, effectiveFrom]
      properties:
        category: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION, SERVICE] }
        countryCode: { type: string, description: ISO-2 code or * for default }
        priceUsd: { type: number, minimum: 0 }
        effectiveFrom: { type: string, format: date }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        last4: { type: string }
        rateLimitPerMinute: { type: integer }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorName: { type: [string, 'null'] }
        actorType: { type: string, enum: [USER, API_KEY, SYSTEM] }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [CAMPAIGN_COMPLETED, CAMPAIGN_AUTO_PAUSED, QUALITY_DROPPED, CREDENTIALS_FAILED] }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'] }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

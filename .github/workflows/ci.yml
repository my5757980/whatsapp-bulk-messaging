name: CI

on:
  # Branch pushes are covered by their pull request; main runs after every merge.
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wbm
          POSTGRES_PASSWORD: wbm
          POSTGRES_DB: wbm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wbm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        # Redis' default maxmemory-policy is noeviction, as BullMQ requires.
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://wbm:wbm@localhost:5432/wbm
      DATABASE_URL_TEST: postgresql://wbm:wbm@localhost:5432/wbm_test
      REDIS_URL: redis://localhost:6379
      META_GRAPH_BASE_URL: http://localhost:4010
      META_GRAPH_API_VERSION: v27.0
      APP_URL: http://localhost:3000
      COOKIE_SECURE: 'false'
      LOG_LEVEL: warn
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: wbm
      S3_ACCESS_KEY: wbm
      S3_SECRET_KEY: wbm-secret-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - name: Generate throwaway test secrets (never committed)
        run: |
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "OPS_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "META_APP_SECRET=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "META_WEBHOOK_VERIFY_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "ANTHROPIC_API_KEY=test-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - name: Create test database
        run: PGPASSWORD=wbm psql -h localhost -U wbm -d wbm -c 'CREATE DATABASE wbm_test;'
      - name: Start S3-compatible storage (MinIO via Chainguard image)
        run: docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=wbm -e MINIO_ROOT_PASSWORD=wbm-secret-key cgr.dev/chainguard/minio:latest server /data
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run lint:contracts
      - name: Check alert rules (promtool)
        run: docker run --rm -v "$PWD/ops:/ops:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /ops/alerts.yml
      - run: npm run build -w @wbm/shared
      - run: npm run db:generate -w @wbm/api
      - run: npm run typecheck
      - run: npm test
      # The JSON reports let the next steps list every failure (logs need admin rights; a step shows 10 annotations).
      - name: Integration tests
        id: integration
        working-directory: apps/api
        run: npx vitest run --project integration --passWithNoTests --reporter=default --reporter=github-actions --reporter=json --outputFile.json=../../vitest-integration.json
      - name: List the failed integration tests
        if: failure() && steps.integration.outcome == 'failure'
        run: node tools/ci/vitest-failures.mjs vitest-integration.json integration
      - name: Contract tests
        id: contract
        if: success() || steps.integration.outcome == 'failure'
        working-directory: apps/api
        run: npx vitest run --project contract --passWithNoTests --reporter=default --reporter=github-actions --reporter=json --outputFile.json=../../vitest-contract.json
      - name: List the failed contract tests
        if: failure() && steps.contract.outcome == 'failure'
        run: node tools/ci/vitest-failures.mjs vitest-contract.json contract
      # Feature 010 (SC-001): a 10-rule segment counted over 200,000 contacts; the timing is a notice annotation.
      - name: Segment count over 200,000 contacts (perf)
        if: success()
        working-directory: apps/api
        env:
          PERF_SEGMENTS: '1'
        run: npx vitest run --project integration test/integration/segments-perf.int-spec.ts --reporter=default --reporter=github-actions

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wbm
          POSTGRES_PASSWORD: wbm
          POSTGRES_DB: wbm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wbm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://wbm:wbm@localhost:5432/wbm
      REDIS_URL: redis://localhost:6379
      META_GRAPH_BASE_URL: http://localhost:4010
      META_GRAPH_API_VERSION: v27.0
      # Feature 009: template media samples (carousel cards) use the Resumable Upload API, which needs the
      # numeric app id; the same value the integration tests use and mock-meta expects.
      META_APP_ID: '1234567890'
      MOCK_WEBHOOK_TARGET: http://localhost:4000/api/webhooks/meta
      # Feature 004: the e2e run talks to mock-meta's fake Claude endpoint, never the real model.
      ANTHROPIC_BASE_URL: http://localhost:4010/anthropic
      # Feature 005: tracked links are answered by the api at /l/:code.
      PUBLIC_LINK_BASE_URL: http://localhost:4000/l
      # Feature 006: webhook endpoints and mock stores live on mock-meta at http://localhost:4010.
      OUTBOUND_ALLOW_LOCAL: 'true'
      # Feature 009: the expired sweep's grace and interval, shortened so the e2e run sees "not delivered in time".
      EXPIRED_SWEEP_GRACE_SECONDS: '5'
      EXPIRED_SWEEP_EVERY_SECONDS: '10'
      # Feature 008: the mock Stripe gateway on mock-meta; it posts signed events to APP_URL.
      STRIPE_API_BASE_URL: http://localhost:4010/stripe
      APP_URL: http://localhost:3000
      COOKIE_SECURE: 'false'
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: wbm
      S3_ACCESS_KEY: wbm
      S3_SECRET_KEY: wbm-secret-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - name: Generate throwaway test secrets (never committed)
        run: |
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "OPS_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "META_APP_SECRET=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "META_WEBHOOK_VERIFY_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "ANTHROPIC_API_KEY=test-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build -w @wbm/shared
      - run: npm run db:generate -w @wbm/api
      - run: npm run db:migrate
      - name: Seed the admin used by the e2e specs (quickstart §2)
        run: npm run db:seed -- --admin-email admin@company.test --admin-password "ChangeMe-12345"
      - name: Start S3-compatible storage (MinIO via Chainguard image)
        run: docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=wbm -e MINIO_ROOT_PASSWORD=wbm-secret-key cgr.dev/chainguard/minio:latest server /data
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan the git history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the api/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: wbm-api:ci
      - name: Build the migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
          load: true
          tags: wbm-migrate:ci
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          build-args: API_INTERNAL_URL=http://api:4000
          tags: wbm-web:ci
      # 002 T102: the live chat event stream must pass through the standalone web server's /api
      # proxy without buffering; a ": ping" comment has to arrive within 20 seconds.
      - name: Smoke-test live chat events through the web proxy
        run: |
          set -euo pipefail
          ADMIN_PASSWORD="$(openssl rand -hex 16)"
          OPS_TOKEN="$(openssl rand -hex 24)"
          cat > smoke.env <<EOF
          NODE_ENV=production
          DATABASE_URL=postgresql://wbm:wbm@postgres:5432/wbm
          REDIS_URL=redis://redis:6379
          TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)
          OPS_TOKEN=$OPS_TOKEN
          META_APP_SECRET=$(openssl rand -hex 16)
          META_WEBHOOK_VERIFY_TOKEN=$(openssl rand -hex 16)
          APP_URL=https://wbm.example.test
          COOKIE_SECURE=true
          S3_ENDPOINT=http://minio:9000
          S3_BUCKET=wbm
          S3_ACCESS_KEY=wbm
          S3_SECRET_KEY=wbm-secret-key
          EOF
          docker network create wbm
          docker run -d --network wbm --name postgres -e POSTGRES_USER=wbm -e POSTGRES_PASSWORD=wbm -e POSTGRES_DB=wbm postgres:16
          docker run -d --network wbm --name redis redis:7
          docker run -d --network wbm --name minio -e MINIO_ROOT_USER=wbm -e MINIO_ROOT_PASSWORD=wbm-secret-key cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 60); do docker exec postgres pg_isready -U wbm >/dev/null 2>&1 && break; sleep 1; done
          docker run --rm --network wbm --env-file smoke.env wbm-migrate:ci
          docker run --rm --network wbm --env-file smoke.env wbm-migrate:ci npx tsx prisma/seed.ts --admin-email smoke@company.test --admin-password "$ADMIN_PASSWORD"
          docker run -d --network wbm --name api --env-file smoke.env -p 4000:4000 wbm-api:ci
          docker run -d --network wbm --name web -p 3000:3000 wbm-web:ci
          dump() { docker logs api 2>&1 | tail -60; docker logs web 2>&1 | tail -30; }
          up=no
          for i in $(seq 1 60); do
            if curl -sf -H "x-ops-token: $OPS_TOKEN" http://localhost:4000/api/health >/dev/null && curl -sf -o /dev/null http://localhost:3000/login; then up=yes; break; fi
            sleep 2
          done
          if [ "$up" != yes ]; then echo "api or web did not start"; dump; exit 1; fi
          # Session cookies are Secure (production); over plain HTTP the cookie is passed by hand.
          curl -sS -D login-headers.txt -o /dev/null -H 'content-type: application/json' \
            -d "{\"email\":\"smoke@company.test\",\"password\":\"$ADMIN_PASSWORD\"}" http://localhost:3000/api/auth/login
          SID="$(grep -i '^set-cookie: sid=' login-headers.txt | head -1 | sed -E 's/^[Ss]et-[Cc]ookie: (sid=[^;]+).*/\1/' | tr -d '\r' || true)"
          if [ -z "$SID" ]; then echo "sign-in through the proxy returned no session"; cat login-headers.txt; dump; exit 1; fi
          # Pings come every 15 s; read the stream for 20 s as a browser would (compression allowed).
          timeout 20 curl -sN --compressed -H "Cookie: $SID" -H 'accept: text/event-stream' http://localhost:3000/api/inbox/events > events.txt || true
          head -c 300 events.txt; echo
          if grep -q '^: ping' events.txt; then
            echo "A live chat ping arrived through the web proxy within 20 seconds"
          else
            echo "No ping through the web proxy within 20 seconds"; dump; exit 1
          fi

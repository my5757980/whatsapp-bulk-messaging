# Prometheus alert rules (constitution Principle VI, research R19, T194).
#
# Scrape both processes with the `X-Ops-Token` header, from the internal network only:
#   job "wbm-api":    http://<api>:<API_PORT>/metrics
#   job "wbm-worker": http://<worker>:<WORKER_PORT>/metrics
# Both expose wbm_queue_depth, so a stopped worker still shows a growing queue through the api.
# Validate with: promtool check rules ops/alerts.yml
groups:
  - name: wbm-delivery
    rules:
      - alert: WbmHighFailureRate
        expr: |
          (
            sum(increase(wbm_messages_total{status="FAILED"}[10m]))
              /
            sum(increase(wbm_messages_total{status=~"SENT|FAILED"}[10m]))
          ) > 0.05
          and on()
          sum(increase(wbm_messages_total{status=~"SENT|FAILED"}[10m])) >= 20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of messages failed in the last 10 minutes
          description: >-
            {{ $value | humanizePercentage }} of sends failed. Check wbm_send_errors_total by code,
            the number's quality and limit in Settings > Numbers, and pause running campaigns if needed.

      - alert: WbmQueueNotDraining
        expr: |
          max by (queue) (min_over_time(wbm_queue_depth{queue!~"send-.+"}[5m])) > 0
          and
          max by (queue) (delta(wbm_queue_depth{queue!~"send-.+"}[5m])) >= 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Queue {{ $labels.queue }} has not gone down for 5 minutes'
          description: >-
            Jobs are waiting but the queue is not shrinking. Check that the worker is running and
            look at its logs and the failed jobs of this queue.

      - alert: WbmSendQueueStalled
        expr: |
          max by (queue) (min_over_time(wbm_queue_depth{queue=~"send-.+"}[5m])) > 0
          and on()
          (sum(increase(wbm_messages_total{status=~"SENT|FAILED"}[5m])) or vector(0)) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Send queue {{ $labels.queue }} has jobs but nothing was sent for 5 minutes'
          description: >-
            Send queues keep a small buffer, so their depth stays flat while healthy; this fires
            only when no message was sent or failed. Check the worker, the number's connection
            and sending switch, and Meta reachability.

      - alert: WbmWebhookLagHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(wbm_webhook_lag_seconds_bucket[5m]))) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Webhook processing lag p95 is above 60 seconds
          description: >-
            Status updates reach the dashboard late (p95 {{ $value | humanizeDuration }}). Check
            the webhooks queue depth and the worker's CPU and database latency.

      - alert: WbmNoWebhooksWhileRunning
        expr: |
          min_over_time(wbm_campaigns_running[15m]) > 0
          and on()
          (sum(increase(wbm_webhook_lag_seconds_count[15m])) or vector(0)) == 0
        labels:
          severity: critical
        annotations:
          summary: No webhooks for 15 minutes while campaigns are running
          description: >-
            Meta status updates are not arriving. Check the webhook URL and verify token in the
            Meta app, the public endpoint's TLS certificate, and POST /api/webhooks/meta in the api logs.

      - alert: WbmInboundMediaFailing
        expr: |
          (
            sum(increase(wbm_inbound_media_failures_total[15m]))
              /
            sum(increase(wbm_inbox_messages_total{direction="in",kind=~"image|video|audio|document|sticker"}[15m]))
          ) > 0.10
          and on()
          sum(increase(wbm_inbox_messages_total{direction="in",kind=~"image|video|audio|document|sticker"}[15m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 10% of customer media could not be downloaded in the last 15 minutes
          description: >-
            Live chat shows "media unavailable" for these messages. Check the worker logs for
            "Inbound media download failed", the number's access token, Meta reachability and storage (S3).

      - alert: WbmTargetDown
        expr: |
          up{job=~"wbm-api|wbm-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} is not answering /metrics'
          description: >-
            Prometheus cannot scrape this process, so the other alerts may stay silent. Check the
            container, its HEALTHCHECK and the X-Ops-Token used by the scrape job.

      - alert: WbmFlowApiFailing
        expr: |
          (
            sum(increase(wbm_flow_api_calls_total{outcome!="success"}[15m]))
              /
            sum(increase(wbm_flow_api_calls_total[15m]))
          ) > 0.20
          and on()
          sum(increase(wbm_flow_api_calls_total[15m])) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 20% of chatbot flow API calls failed in the last 15 minutes
          description: >-
            Customers in these flows take the "failed" branch. Check the worker logs for "Flow API
            step failed" (with its reason) and the external systems the flows call.

      - alert: WbmAiFailing
        expr: |
          (
            sum(increase(wbm_ai_turns_total{result="failed"}[15m]))
              /
            sum(increase(wbm_ai_turns_total{result=~"sent|failed|opted_out|dropped|newer"}[15m]))
          ) > 0.20
          and on()
          sum(increase(wbm_ai_turns_total{result=~"sent|failed|opted_out|dropped|newer"}[15m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 20% of AI agent turns failed in the last 15 minutes
          description: >-
            Customers get the fallback message and wait for a person. Check the worker logs for "AI
            turn failed" (with its reason), the Anthropic key and status page, and the AI usage page.

      - alert: WbmDripLagging
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(wbm_drip_due_lag_seconds_bucket[5m]))) > 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Drip steps are queued more than 5 minutes after they fall due (p95)
          description: >-
            Drip messages go out late (p95 {{ $value | humanizeDuration }}; quiet hours are not
            counted). Check that the worker runs the drips tick every 30 seconds, the drips and
            send queue depths, and the worker logs for "drip tick failed".

      - alert: WbmWebhookBacklog
        expr: |
          max(wbm_webhook_backlog) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Webhook deliveries to active endpoints have been due for more than 5 minutes
          description: >-
            {{ $value }} deliveries are waiting. Check that the worker runs the webhooks-out queue and
            its 30-second sweep, the webhooks-out queue depth, and the worker logs for "webhook
            delivery".

      - alert: WbmStoreEventsFailing
        expr: |
          (
            sum(increase(wbm_store_events_total{result="failed"}[15m]))
              /
            sum(increase(wbm_store_events_total[15m]))
          ) > 0.20
          and sum(increase(wbm_store_events_total[15m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 20% of store events failed in the last 15 minutes
          description: >-
            Order notifications, COD questions or cart reminders may be missing. Check Integrations >
            Stores for stores in error, the store API keys, and the worker logs for "Store event
            failed". The 15-minute reconciler fetches missed orders again.

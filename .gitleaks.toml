# Secret scanning for the CI secret-scan job: gitleaks' built-in rules plus narrow allowlists for
# known false positives (exact lines only).

title = "WBM gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Example Web Push subscription keys used as test fixtures in the live chat alert tests (public example values, not secrets)"
regexTarget = "line"
regexes = [
  '''BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM''',
  '''tBHItJI5svbpez7KI4CCXg''',
]

[[allowlists]]
description = "Feature 005: the spec folder name '005-campaign-growth' in the contract-test helper's file map (apps/api/test/contract/openapi-validator.ts) matches generic-api-key because the line also contains 'api'; it is a folder name, not a secret"
regexTarget = "line"
regexes = [
  '''growth-api\.openapi\.yaml': '005-campaign-growth''',
]

[[allowlists]]
description = "Feature 006: the published Standard Webhooks reference vector (a documentation example secret and its signature, not real credentials) in packages/shared/src/integrations/signing.test.ts and the integrations contract example"
regexTarget = "line"
regexes = [
  '''whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw''',
  '''g0hM9SsE\+OTPJTGt/tmIKtSyZlE3uFJELVlNIOLJ1OE=''',
]

[[allowlists]]
description = "Feature 006: placeholder text in the API campaign call example of commit b2f193e (apps/api/src/modules/integrations/api-campaigns/api-campaigns.service.ts); 'wbk_YOUR_KEY' and the idempotency example are not secrets, and later commits use $WBM_API_KEY"
regexTarget = "line"
regexes = [
  '''Authorization: Bearer wbk_YOUR_KEY''',
  '''Idempotency-Key: a-unique-id-per-message''',
]

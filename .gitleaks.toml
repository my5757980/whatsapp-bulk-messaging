# Secret scanning for the CI secret-scan job: gitleaks' built-in rules plus narrow allowlists for
# known false positives (exact lines only).

title = "WBM gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Example Web Push subscription keys used as test fixtures in the live chat alert tests (public example values, not secrets)"
regexTarget = "line"
regexes = [
  '''BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM''',
  '''tBHItJI5svbpez7KI4CCXg''',
]

[[allowlists]]
description = "Feature 005: the spec folder name '005-campaign-growth' in the contract-test helper's file map (apps/api/test/contract/openapi-validator.ts) matches generic-api-key because the line also contains 'api'; it is a folder name, not a secret"
regexTarget = "line"
regexes = [
  '''growth-api\.openapi\.yaml': '005-campaign-growth''',
]

[[allowlists]]
description = "Feature 006: the published Standard Webhooks reference vector (a documentation example secret and its signature, not real credentials) in packages/shared/src/integrations/signing.test.ts and the integrations contract example"
regexTarget = "line"
regexes = [
  '''whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw''',
  '''g0hM9SsE\+OTPJTGt/tmIKtSyZlE3uFJELVlNIOLJ1OE=''',
]

[[allowlists]]
description = "Feature 006: placeholder text in the API campaign call example of commit b2f193e (apps/api/src/modules/integrations/api-campaigns/api-campaigns.service.ts); 'wbk_YOUR_KEY' and the idempotency example are not secrets, and later commits use $WBM_API_KEY"
regexTarget = "line"
regexes = [
  '''Authorization: Bearer wbk_YOUR_KEY''',
  '''Idempotency-Key: a-unique-id-per-message''',
]

[[allowlists]]
description = "Feature 006: made-up store credentials in the store tests (apps/api/test/integration/integrations-shopify.int-spec.ts, integrations-woocommerce.int-spec.ts and the integrations contract test); they only sign requests to nock fakes"
regexTarget = "line"
regexes = [
  '''shopify-client-secret-for-tests''',
  '''ck_test_0123456789abcdef''',
  '''cs_test_0123456789abcdef''',
  '''ck_contract_0123456789''',
  '''cs_contract_0123456789''',
]

[[allowlists]]
description = "Feature 008: made-up Stripe keys of the mock gateway (tools/mock-meta/src/stripe.ts), the e2e helpers and the api tests; they only reach mock-meta and nock fakes, never Stripe"
regexTarget = "line"
regexes = [
  '''rk_test_mockOK1234''',
  '''rk_test_mockOKnoperm''',
  '''rk_test_mockXXnockout''',
  '''rk_live_mockOK1234''',
  '''rk_test_wrong00000000001''',
  '''rk_test_unit0000000001''',
  '''rk_test_fake0000000001''',
  '''rk_test_fake0000000002''',
  '''sk_test_fake0000000001''',
  '''sk_test_abcdefghij12''',
  '''sk_live_abcdefghij12''',
]

[[allowlists]]
description = "Feature 010: made-up passwords of the two-factor sign-in tests (apps/api/test/integration/two-factor.int-spec.ts, apps/api/test/contract/contacts-settings.contract-spec.ts, apps/web/e2e/security-us6-2fa.spec.ts); they only sign in to test databases"
regexTarget = "line"
regexes = [
  '''const PASSWORD = 'Two-Factor-Password-12';''',
  '''const password = 'Contract-2FA-Password-1';''',
  '''const PASSWORD = 'E2e-Two-Factor-Pass-1';''',
  '''hashRecoveryCode\(key, 'ABCDE-FGH12'\)''',
]

[[allowlists]]
description = "Feature 008: made-up Stripe webhook signing secrets and idempotency keys in the mock gateway and the api tests (signatures checked against fakes only)"
regexTarget = "line"
regexes = [
  '''whsec_abc123def456''',
  '''whsec_fake000000000000000001''',
  '''whsec_wrong0000000000000001''',
  '''whsec_test_secret_000[01]''',
  '''idempotencyKey: .wbm-(endpoint|check)-1.''',
]

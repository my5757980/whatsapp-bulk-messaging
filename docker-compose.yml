# Local infrastructure only. App processes (web, api, worker, mock-meta) run via `npm run dev`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wbm
      POSTGRES_PASSWORD: wbm
      POSTGRES_DB: wbm
    # Non-default host ports avoid clashing with other local Postgres/Redis instances.
    ports:
      - '${WBM_POSTGRES_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wbm']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # noeviction + AOF are required by BullMQ (research R6); the API refuses to start otherwise.
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '${WBM_REDIS_PORT:-6380}:6379'
    volumes:
      - redisdata:/data

  # MinIO stopped publishing community images (Oct 2025); Chainguard's free MinIO image is a
  # drop-in replacement. The API creates the bucket on startup (StorageService.ensureBucket).
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: wbm
      MINIO_ROOT_PASSWORD: wbm-secret-key
    ports:
      - '${WBM_MINIO_PORT:-9000}:9000'
      - '${WBM_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
